  content_type: application/json
  shape: '{"type": "<class>", "errors": [{"code": "<code>", "detail": "<message>", "attr": "<field|null>"}]}'
  library: drf-standardized-errors (Django REST Framework)
  detail: Returned by routed API views. Carries a stable machine-readable `code`.
- id: bare-detail
  content_type: application/json
  shape: '{"detail": "<message>"}'
  detail: >-
    Returned by the router for an unknown path. No error code, so an agent cannot
    distinguish routing failure from a resource-not-found on a real endpoint.
