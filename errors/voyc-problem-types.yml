note: >-
  Voyc publishes no public error reference. Every entry below was observed on a
  live, unauthenticated response from Voyc's own API host. Two DIFFERENT error
  envelopes are in production simultaneously, which is itself the finding: routed
  API errors use the drf-standardized-errors shape, while unrouted paths fall back
  to a bare {"detail": "..."} object. Neither is application/problem+json, so the
  API does not conform to RFC 9457.
envelopes:
