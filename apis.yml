apis:
- name: Voyc API v3
  description: >-
    Voyc's integration API, monitored on the public status page as "Voyc API v3"
    (Data Export) alongside "Voyc API" (Conversation Uploads & Reporting). The
    production host is api.app.voyc.ai, confirmed live 2026-08-14: /v3/ endpoints
    return a credential-gated 403 with Voyc's drf-standardized-errors envelope and
    /api/v2/ serves the web application. Integrating systems register an "app" per
    organisation and issue access tokens through
    /v3/organisation/{organisationId}/app/{appId}/access-token/. Voyc publishes NO
    public API reference, OpenAPI, or developer portal - the integration
    documentation is provided to customers during onboarding - so no machine-readable
    contract exists to harvest.
  humanURL: https://help.voyc.ai/en/
  baseURL: https://api.app.voyc.ai
