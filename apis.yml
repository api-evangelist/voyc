aid: voyc
name: Voyc
description: Voyc is a conversation intelligence and compliance monitoring platform
  for regulated industries such as financial services and insurance. The platform
  automatically monitors 100% of contact centre interactions using speech analytics
  AI, flagging high-risk cases, complaints, and vulnerable customers in near real
  time, automating QA review, and producing the management information firms need
  to evidence regulatory compliance (including FCA Consumer Duty). Calls reach Voyc
  from telephony platforms like Twilio, Genesys, Five9, RingCentral, Aircall, Amazon
  Connect, and Talkdesk via SFTP or API, and a Voyc API (v3) supports conversation
  uploads and data export alongside webhooks.
