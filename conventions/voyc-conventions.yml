api_host: https://api.app.voyc.ai
host_derivation: >-
  Voyc's first-party app computes its API base as `${location.protocol}//api.${location.host}`,
  so the production API host for app.voyc.ai is api.app.voyc.ai. Confirmed live:
  the host resolves and returns Voyc's own JSON error envelope under /api and /v3.
authentication:
