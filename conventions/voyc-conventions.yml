  artifact: authentication/voyc-authentication.yml
  documented_publicly: false
versioning:
  scheme: uri-path
  versions_in_production:
  - prefix: /api/v2
    detail: Web-application surface used by the Voyc SPA.
  - prefix: /v3
    detail: >-
      Voyc API v3 — the integration surface. Note it is NOT under /api; /api/v3/
      returns "An unknown API path was supplied.".
  current: v3
  policy_url: null
  artifact: lifecycle/voyc-lifecycle.yml
idempotency:
  supported: unknown
  header: null
  detail: >-
    No idempotency key header is documented, and none appears in Voyc's own client
    code. Token creation (POST .../access-token/) is sent with an empty body and no
